    <rect x="860" y="140" width="34" height="60" class="furn-dark"/><rect x="900" y="140" width="34" height="60" class="furn-dark"/>
    <g stroke="#94a3b8" stroke-width="1"><path d="M864 72h26M864 80h26M864 88h26M864 96h26M864 104h26M864 112h26"/><path d="M904 72h26M904 80h26M904 88h26M904 96h26M904 104h26M904 112h26"/><path d="M944 72h26M944 80h26M944 88h26M944 96h26M944 104h26M944 112h26"/><path d="M864 148h26M864 156h26M864 164h26M864 172h26M864 180h26M864 188h26"/><path d="M904 148h26M904 156h26M904 164h26M904 172h26M904 180h26M904 188h26"/></g>
  </g>
