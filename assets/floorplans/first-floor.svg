    <rect x="384" y="70" width="110" height="50" rx="3" class="furn"/><rect x="424" y="130" width="28" height="22" rx="6" class="chair"/><rect x="384" y="190" width="40" height="22" class="furn-dark"/>
    <rect x="544" y="70" width="110" height="50" rx="3" class="furn"/><rect x="584" y="130" width="28" height="22" rx="6" class="chair"/><rect x="544" y="190" width="40" height="22" class="furn-dark"/>
    <rect x="704" y="70" width="110" height="50" rx="3" class="furn"/><rect x="744" y="130" width="28" height="22" rx="6" class="chair"/><rect x="704" y="190" width="40" height="22" class="furn-dark"/>
