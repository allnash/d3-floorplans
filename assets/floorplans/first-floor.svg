  <path class="partition" d="M364 560H440V640"/>
  <path class="partition" d="M364 640H440"/>
  <path class="partition" d="M364 700H440V756"/>

  <!-- windows (north + west + south) -->
  <g>
    <path class="window" d="M120 40H280"/><path class="window-line" d="M120 40H280"/>
    <path class="window" d="M400 40H500"/><path class="window-line" d="M400 40H500"/>
    <path class="window" d="M560 40H660"/><path class="window-line" d="M560 40H660"/>
    <path class="window" d="M720 40H820"/><path class="window-line" d="M720 40H820"/>
    <path class="window" d="M1040 40H1130"/><path class="window-line" d="M1040 40H1130"/>
    <path class="window" d="M40 100V240"/><path class="window-line" d="M40 100V240"/>
    <path class="window" d="M40 340V480"/><path class="window-line" d="M40 340V480"/>
    <path class="window" d="M460 760H640"/><path class="window-line" d="M460 760H640"/>
    <path class="window" d="M700 760H900"/><path class="window-line" d="M700 760H900"/>
    <path class="window" d="M1160 300V400"/><path class="window-line" d="M1160 300V400"/>
    <path class="window" d="M1160 460V560"/><path class="window-line" d="M1160 460V560"/>
  </g>

  <!-- doors: gap, leaf, swing arc -->
