    <path class="door-leaf" d="M1000 180H1040"/><path class="door-arc" d="M1040 180A40 40 0 0 1 1000 220"/>
    <!-- restrooms -->
    <path class="door-gap" d="M1000 280V320"/>
    <path class="door-leaf" d="M1000 280H1040"/><path class="door-arc" d="M1040 280A40 40 0 0 1 1000 320"/>
    <path class="door-gap" d="M1000 460V500"/>
    <path class="door-leaf" d="M1000 460H1040"/><path class="door-arc" d="M1040 460A40 40 0 0 1 1000 500"/>
    <!-- storage -->
    <path class="door-gap" d="M1000 640V680"/>
    <path class="door-leaf" d="M1000 680H1040"/><path class="door-arc" d="M1040 680A40 40 0 0 0 1000 640"/>
    <!-- phone booths -->
    <path class="door-gap" d="M440 580V610"/><path class="door-leaf" d="M440 610H470"/>
    <path class="door-gap" d="M440 650V680"/><path class="door-leaf" d="M440 680H470"/>
    <path class="door-gap" d="M440 710V740"/><path class="door-leaf" d="M440 740H470"/>
    <!-- fire exit east -->
    <path class="door-gap" d="M1160 660V700"/>
    <path class="door-leaf" d="M1160 660H1120"/><path class="door-arc" d="M1120 660A40 40 0 0 0 1160 700"/>
  </g>

  <!-- ===== furniture ===== -->
