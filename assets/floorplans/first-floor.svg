    </g>
    <g class="chair"><rect x="858" y="280" width="24" height="14" rx="5"/><rect x="918" y="280" width="24" height="14" rx="5"/><rect x="858" y="366" width="24" height="14" rx="5"/><rect x="918" y="366" width="24" height="14" rx="5"/></g>

    <g class="furn">
      <rect x="480" y="440" width="60" height="30"/><rect x="540" y="440" width="60" height="30"/>
      <rect x="480" y="470" width="60" height="30"/><rect x="540" y="470" width="60" height="30"/>
    </g>
    <g class="chair"><rect x="498" y="420" width="24" height="14" rx="5"/><rect x="558" y="420" width="24" height="14" rx="5"/><rect x="498" y="506" width="24" height="14" rx="5"/><rect x="558" y="506" width="24" height="14" rx="5"/></g>
    <g class="furn">
