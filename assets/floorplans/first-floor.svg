<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e5e7eb" stroke-width="0.6"/>
    </pattern>
    <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f1f5f9"/>
      <path d="M20 0H0V20" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <pattern id="wood" width="60" height="8" patternUnits="userSpaceOnUse">
      <rect width="60" height="8" fill="#eef2ff"/>
      <path d="M0 8H60" stroke="#e0e7ff" stroke-width="0.8"/>
      <path d="M30 0V8" stroke="#e0e7ff" stroke-width="0.6"/>
    </pattern>
    <pattern id="carpet" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f5f7fb"/>
      <circle cx="6" cy="6" r="0.9" fill="#e3e8f2"/>
    </pattern>
    <style>
      .wall { stroke:#1f2937; stroke-width:8; stroke-linecap:square; fill:none; }
      .partition { stroke:#374151; stroke-width:4; stroke-linecap:square; fill:none; }
      .glass { stroke:#60a5fa; stroke-width:3; fill:none; }
      .door-gap { stroke:#ffffff; stroke-width:10; stroke-linecap:butt; }
      .door-leaf { stroke:#1f2937; stroke-width:2.5; fill:none; }
      .door-arc { stroke:#9ca3af; stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
      .window { stroke:#ffffff; stroke-width:10; }
      .window-line { stroke:#3b82f6; stroke-width:2; }
      .furn { fill:#ffffff; stroke:#64748b; stroke-width:1.5; }
      .furn-dark { fill:#e2e8f0; stroke:#64748b; stroke-width:1.5; }
      .chair { fill:#ffffff; stroke:#64748b; stroke-width:1.2; }
      .room { font-size:15px; font-weight:600; fill:#334155; letter-spacing:0.4px; text-anchor:middle; }
      .area { font-size:11px; fill:#64748b; text-anchor:middle; }
      .dim { stroke:#94a3b8; stroke-width:1; }
      .dim-text { font-size:11px; fill:#64748b; text-anchor:middle; }
      .fixture { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; }
      .title { font-size:13px; font-weight:700; fill:#0f172a; letter-spacing:1.5px; }
      .sub { font-size:10px; fill:#475569; letter-spacing:0.5px; }
    </style>
  </defs>

  <!-- sheet -->
  <rect width="1200" height="800" fill="#ffffff"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- floor finishes -->
  <rect x="44" y="44" width="312" height="252" fill="url(#carpet)"/>         <!-- conference A -->
  <rect x="44" y="304" width="312" height="212" fill="url(#carpet)"/>        <!-- conference B -->
  <rect x="44" y="524" width="312" height="232" fill="url(#wood)"/>          <!-- reception -->
  <rect x="364" y="44" width="632" height="192" fill="url(#carpet)"/>        <!-- offices + server -->
  <rect x="1004" y="44" width="152" height="192" fill="url(#tile)"/>         <!-- kitchen -->
  <rect x="364" y="244" width="632" height="512" fill="url(#carpet)"/>       <!-- open office -->
  <rect x="1004" y="244" width="152" height="352" fill="url(#tile)"/>        <!-- restrooms -->
  <rect x="1004" y="604" width="152" height="152" fill="#f3f4f6"/>           <!-- storage -->

  <!-- exterior walls -->
  <rect x="40" y="40" width="1120" height="720" class="wall"/>

  <!-- interior walls -->
  <path class="wall" d="M360 40V760"/>
  <path class="wall" d="M40 300H360"/>
  <path class="wall" d="M40 520H360"/>
  <path class="wall" d="M360 240H1160"/>
  <path class="partition" d="M520 40V240"/>
  <path class="partition" d="M680 40V240"/>
  <path class="partition" d="M840 40V240"/>
  <path class="wall" d="M1000 40V760"/>
  <path class="partition" d="M1000 440H1160"/>
  <path class="wall" d="M1000 600H1160"/>
