    <path class="door-gap" d="M160 760H240"/>
    <path class="door-leaf" d="M160 760V720"/><path class="door-arc" d="M160 720A40 40 0 0 1 200 760"/>
    <path class="door-leaf" d="M240 760V720"/><path class="door-arc" d="M240 720A40 40 0 0 0 200 760"/>
    <!-- reception -> open office -->
    <path class="door-gap" d="M360 660V700"/>
    <path class="door-leaf" d="M360 700H400"/><path class="door-arc" d="M400 700A40 40 0 0 0 360 660"/>
    <!-- conference A -->
    <path class="door-gap" d="M360 250V290"/>
    <path class="door-leaf" d="M360 290H320"/><path class="door-arc" d="M320 290A40 40 0 0 1 360 250"/>
    <!-- conference B -->
    <path class="door-gap" d="M360 470V510"/>
    <path class="door-leaf" d="M360 510H320"/><path class="door-arc" d="M320 510A40 40 0 0 1 360 470"/>
    <!-- reception -> conference B -->
    <path class="door-gap" d="M300 520H340"/>
    <path class="door-leaf" d="M300 520V480"/><path class="door-arc" d="M300 480A40 40 0 0 1 340 520"/>
