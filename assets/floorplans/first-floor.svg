    <g class="furn">
      <rect x="660" y="300" width="60" height="30"/><rect x="720" y="300" width="60" height="30"/>
      <rect x="660" y="330" width="60" height="30"/><rect x="720" y="330" width="60" height="30"/>
    </g>
