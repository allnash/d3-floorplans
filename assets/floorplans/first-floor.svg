    <rect x="520" y="700" width="120" height="40" rx="8" class="furn"/>
    <rect x="680" y="660" width="60" height="60" rx="30" class="furn-dark"/>
    <g class="chair"><circle cx="760" cy="690" r="9"/><circle cx="660" cy="690" r="9"/><circle cx="710" cy="640" r="9"/><circle cx="710" cy="740" r="9"/></g>
    <rect x="800" y="640" width="160" height="6" class="furn-dark"/>
    <g class="chair"><rect x="820" y="660" width="24" height="14" rx="5"/><rect x="868" y="660" width="24" height="14" rx="5"/><rect x="916" y="660" width="24" height="14" rx="5"/></g>
    <!-- printers / lockers along the wall -->
