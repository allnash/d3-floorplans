    <path class="door-leaf" d="M470 240V200"/><path class="door-arc" d="M470 200A40 40 0 0 1 510 240"/>
    <path class="door-gap" d="M630 240H670"/>
    <path class="door-leaf" d="M630 240V200"/><path class="door-arc" d="M630 200A40 40 0 0 1 670 240"/>
    <path class="door-gap" d="M790 240H830"/>
